<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="referrer" content="no-referrer" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }
    body {
      font-family: -apple-system, 'Segoe UI', sans-serif;
      background: #f8f9fa;
      color: #212529;
    }

    header {
      background: #e8392a;
      color: white;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    header span { font-weight: 400; font-size: 12px; opacity: 0.85; margin-left: 6px; }
    #back-btn {
      background: none;
      border: none;
      color: white;
      font-size: 18px;
      cursor: pointer;
      padding: 0 4px;
      display: none;
      font-weight: 400;
    }

    .section { padding: 14px 16px; }

    .row { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    input:focus { border-color: #e8392a; }
    button {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-primary { background: #e8392a; color: white; }
    .btn-primary:hover { background: #c0301f; }

    /* 플랫폼 선택 */
    #platform-section {
      display: flex;
      background: white;
      border-bottom: 1px solid #dee2e6;
      padding: 8px 16px;
      gap: 6px;
    }
    .platform-btn {
      flex: 1;
      padding: 6px 0;
      border: 1.5px solid #dee2e6;
      border-radius: 6px;
      background: white;
      font-size: 13px;
      font-weight: 600;
      color: #6c757d;
      cursor: pointer;
      transition: all 0.15s;
    }
    .platform-btn.active {
      border-color: #e8392a;
      color: #e8392a;
      background: #fff3f2;
    }
    .platform-btn[data-platform="taobao"].active {
      border-color: #ff5000;
      color: #ff5000;
      background: #fff5f0;
    }

    /* 검색 */
    #search-section { background: white; border-bottom: 1px solid #dee2e6; }
    #query-input { width: 100%; padding: 10px 12px; font-size: 14px; }

    /* 상태 메시지 */
    #status {
      padding: 12px 16px;
      font-size: 13px;
      color: #6c757d;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid #dee2e6;
      border-top-color: #e8392a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #error {
      padding: 10px 16px;
      font-size: 13px;
      color: #dc3545;
      background: #fff5f5;
      display: none;
    }

    /* 결과 카드 */
    #results { display: none; padding: 12px 16px; flex-direction: column; gap: 12px; }
    #results-header {
      font-size: 12px;
      color: #6c757d;
      padding: 8px 16px 0;
      display: none;
    }

    .card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #dee2e6;
      display: flex;
      flex-direction: column;
    }
    .card-inner { display: flex; gap: 0; }
    .card-img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      flex-shrink: 0;
      background: #f0f0f0;
    }
    .card-img-placeholder {
      width: 90px;
      height: 90px;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }
    .card-body { padding: 10px; flex: 1; min-width: 0; }
    .card-rank {
      font-size: 10px;
      font-weight: 700;
      color: #e8392a;
      text-transform: uppercase;
      margin-bottom: 3px;
    }
    .card-title {
      font-size: 12px;
      color: #212529;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 5px;
    }
    .card-price {
      font-size: 15px;
      font-weight: 700;
      color: #e8392a;
    }
    .card-price span { font-size: 11px; font-weight: 400; color: #6c757d; }
    .card-meta { font-size: 11px; color: #6c757d; margin-top: 3px; }
    .card-reason {
      font-size: 11px;
      color: #495057;
      background: #f8f9fa;
      padding: 7px 10px;
      border-top: 1px solid #f0f0f0;
      line-height: 1.4;
    }
    .card-link {
      display: block;
      text-align: center;
      padding: 7px;
      background: #fff3f2;
      color: #e8392a;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      border-top: 1px solid #ffd6d2;
    }
    .card-link:hover { background: #ffd6d2; }

    /* 키워드 추천 */
    #keywords-section {
      padding: 12px 16px;
      background: white;
      border-bottom: 1px solid #dee2e6;
      display: none;
    }
    #keywords-label {
      font-size: 13px;
      color: #495057;
      margin-bottom: 6px;
    }
    #keywords-label b { color: #e8392a; }
    #keywords-sub {
      font-size: 11px;
      color: #adb5bd;
      margin-bottom: 10px;
    }
    #keywords-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .keyword-pill {
      display: inline-flex;
      flex-direction: column;
      align-items: center;
      padding: 6px 12px;
      background: #fff3f2;
      border: 1px solid #ffd6d2;
      border-radius: 16px;
      cursor: pointer;
      transition: all 0.15s;
      line-height: 1.3;
    }
    .keyword-pill:hover {
      background: #ffd6d2;
      border-color: #e8392a;
    }
    .keyword-zh {
      font-size: 12px;
      color: #e8392a;
      font-weight: 600;
    }
    .keyword-ko {
      font-size: 10px;
      color: #6c757d;
    }

    /* 이미지 추출 섹션 */
    #ocr-section {
      padding: 14px 16px;
      background: white;
    }
    #ocr-btn {
      width: 100%;
      padding: 10px;
      background: #ff6b35;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }
    #ocr-btn:hover { background: #e55a2b; }
    #ocr-btn.active { background: #28a745; }
    #ocr-status {
      font-size: 12px;
      color: #6c757d;
      margin-top: 8px;
      display: none;
    }
    #ocr-result {
      margin-top: 10px;
      display: none;
      background: #f8f9fa;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      overflow: hidden;
    }
    #ocr-result .ocr-original {
      padding: 10px;
      font-size: 12px;
      color: #6c757d;
      border-bottom: 1px solid #dee2e6;
      line-height: 1.5;
      overflow-x: auto;
    }
    #ocr-result .ocr-translated {
      padding: 10px;
      font-size: 13px;
      color: #212529;
      line-height: 1.6;
      overflow-x: auto;
    }
    #ocr-result .ocr-label {
      font-size: 10px;
      font-weight: 700;
      color: #e8392a;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    #ocr-result table {
      width: 100%;
      border-collapse: collapse;
      font-size: 12px;
      margin-top: 4px;
    }
    #ocr-result th, #ocr-result td {
      border: 1px solid #dee2e6;
      padding: 5px 8px;
      text-align: center;
      white-space: nowrap;
    }
    #ocr-result th {
      background: #f1f3f5;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <header>
    <button id="back-btn">&#8592;</button>
    <div>중국 쇼핑 어시스턴트 <span>AI 베스트 5 추천</span></div>
  </header>

  <!-- 플랫폼 선택 -->
  <div id="platform-section">
    <button class="platform-btn active" data-platform="1688">1688</button>
    <button class="platform-btn" data-platform="taobao">타오바오</button>
  </div>

  <!-- 검색 -->
  <div class="section" id="search-section">
    <div class="row">
      <input type="text" id="query-input" placeholder="예: 여아 봄 원피스 90사이즈" />
      <button class="btn-primary" id="search-btn">검색</button>
    </div>
  </div>

  <!-- 상태 -->
  <div id="status"><div class="spinner"></div><span id="status-text">검색 중...</span></div>
  <div id="error"></div>

  <!-- 결과 헤더 -->
  <div id="results-header"></div>

  <!-- 결과 카드 -->
  <div id="results"></div>

  <!-- 키워드 추천 (상세 뷰에서만 표시) -->
  <div id="keywords-section">
    <div id="keywords-label"><b>이 상품이 마음에 드신다면?</b></div>
    <div id="keywords-sub">키워드를 누르면 바로 검색됩니다</div>
    <div id="keywords-list"></div>
  </div>

  <!-- 이미지 텍스트 추출 (상세 뷰에서만 표시) -->
  <div id="ocr-section">
    <button id="ocr-btn">이미지 번역</button>
    <div id="ocr-status"><div class="spinner"></div><span id="ocr-status-text"></span></div>
    <div id="ocr-result">
      <div class="ocr-original"><div class="ocr-label">원문 (중국어)</div><span id="ocr-original-text"></span></div>
      <div class="ocr-translated"><div class="ocr-label">번역 (한국어)</div><span id="ocr-translated-text"></span></div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
