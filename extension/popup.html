<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      max-width: 100%;
      overflow-x: hidden;
    }
    body {
      font-family: -apple-system, 'Segoe UI', sans-serif;
      background: #f8f9fa;
      color: #212529;
    }

    header {
      background: #e8392a;
      color: white;
      padding: 14px 16px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    header span { font-weight: 400; font-size: 12px; opacity: 0.85; margin-left: 6px; }

    .section { padding: 14px 16px; }

    /* API 키 설정 */
    #key-section { border-bottom: 1px solid #dee2e6; }
    #key-section label { font-size: 12px; color: #6c757d; display: block; margin-bottom: 6px; }
    .row { display: flex; gap: 8px; }
    input[type="password"], input[type="text"] {
      flex: 1;
      padding: 8px 10px;
      border: 1px solid #ced4da;
      border-radius: 6px;
      font-size: 13px;
      outline: none;
    }
    input:focus { border-color: #e8392a; }
    button {
      padding: 8px 14px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      cursor: pointer;
      font-weight: 600;
    }
    .btn-primary { background: #e8392a; color: white; }
    .btn-primary:hover { background: #c0301f; }
    .btn-sm { padding: 6px 10px; font-size: 12px; background: #dee2e6; color: #495057; }
    .btn-sm:hover { background: #ced4da; }
    #key-saved { font-size: 12px; color: #28a745; margin-top: 6px; display: none; }

    /* 검색 */
    #search-section { background: white; border-bottom: 1px solid #dee2e6; }
    #query-input { width: 100%; padding: 10px 12px; font-size: 14px; }

    /* 상태 메시지 */
    #status {
      padding: 12px 16px;
      font-size: 13px;
      color: #6c757d;
      display: none;
      align-items: center;
      gap: 8px;
    }
    .spinner {
      width: 16px; height: 16px;
      border: 2px solid #dee2e6;
      border-top-color: #e8392a;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      flex-shrink: 0;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #error {
      padding: 10px 16px;
      font-size: 13px;
      color: #dc3545;
      background: #fff5f5;
      display: none;
    }

    /* 결과 카드 */
    #results { display: none; padding: 12px 16px; display: none; flex-direction: column; gap: 12px; }
    #results-header {
      font-size: 12px;
      color: #6c757d;
      padding: 8px 16px 0;
      display: none;
    }

    .card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid #dee2e6;
      display: flex;
      flex-direction: column;
    }
    .card-inner { display: flex; gap: 0; }
    .card-img {
      width: 90px;
      height: 90px;
      object-fit: cover;
      flex-shrink: 0;
      background: #f0f0f0;
    }
    .card-img-placeholder {
      width: 90px;
      height: 90px;
      background: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      flex-shrink: 0;
    }
    .card-body { padding: 10px; flex: 1; min-width: 0; }
    .card-rank {
      font-size: 10px;
      font-weight: 700;
      color: #e8392a;
      text-transform: uppercase;
      margin-bottom: 3px;
    }
    .card-title {
      font-size: 12px;
      color: #212529;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      margin-bottom: 5px;
    }
    .card-price {
      font-size: 15px;
      font-weight: 700;
      color: #e8392a;
    }
    .card-price span { font-size: 11px; font-weight: 400; color: #6c757d; }
    .card-meta { font-size: 11px; color: #6c757d; margin-top: 3px; }
    .card-reason {
      font-size: 11px;
      color: #495057;
      background: #f8f9fa;
      padding: 7px 10px;
      border-top: 1px solid #f0f0f0;
      line-height: 1.4;
    }
    .card-link {
      display: block;
      text-align: center;
      padding: 7px;
      background: #fff3f2;
      color: #e8392a;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      border-top: 1px solid #ffd6d2;
    }
    .card-link:hover { background: #ffd6d2; }
  </style>
</head>
<body>
  <header>1688 쇼핑 어시스턴트 <span>AI 베스트 3 추천</span></header>

  <!-- 검색 -->
  <div class="section" id="search-section">
    <div class="row">
      <input type="text" id="query-input" placeholder="예: 여아 봄 원피스 90사이즈" />
      <button class="btn-primary" id="search-btn">검색</button>
    </div>
  </div>

  <!-- 상태 -->
  <div id="status"><div class="spinner"></div><span id="status-text">검색 중...</span></div>
  <div id="error"></div>

  <!-- 결과 헤더 -->
  <div id="results-header"></div>

  <!-- 결과 카드 -->
  <div id="results"></div>

  <script src="popup.js"></script>
</body>
</html>
